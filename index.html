<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粵語言語治療 Scratch 小遊戲 - 舌尖音 (d/t) 與 舌根音 (g/k) 辨別</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;800&display=swap');
    
    body {
      font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
      background-color: #2b2b36;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Scratch visual theme elements */
    .scratch-header {
      background-color: #4c97ff;
      border-bottom: 2px solid #3373cc;
    }

    .scratch-sidebar {
      background-color: #f9f9f9;
      border-right: 1px solid #e0e0e0;
    }

    .scratch-card {
      background: white;
      border: 3px solid #e0e0e0;
      border-radius: 16px;
      box-shadow: 0 8px 0 #d0d0d0;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .scratch-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 0 #bcbcbc;
      border-color: #4c97ff;
    }

    .scratch-card:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 #bcbcbc;
    }

    .scratch-btn-green {
      background-color: #4cbf56;
      border-bottom: 4px solid #389640;
    }
    .scratch-btn-green:active {
      border-bottom: 0px solid #389640;
      transform: translateY(4px);
    }

    .scratch-btn-red {
      background-color: #ff4c4c;
      border-bottom: 4px solid #cc3333;
    }
    .scratch-btn-red:active {
      border-bottom: 0px solid #cc3333;
      transform: translateY(4px);
    }

    /* Stage background style */
    .stage-canvas {
      background: linear-gradient(to bottom, #7ec8f8 0%, #a2daf9 50%, #91e07b 50%, #68ca4b 100%);
      position: relative;
      overflow: hidden;
    }

    /* Monster hit shake animation */
    @keyframes monsterHit {
      0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
      20% { transform: scale(0.9) rotate(-10deg); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
      40% { transform: scale(1.1) rotate(10deg); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
      60% { transform: scale(0.95) rotate(-5deg); filter: brightness(1.5); }
      80% { transform: scale(1.05) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
    }

    .animate-hit {
      animation: monsterHit 0.6s ease-in-out;
    }

    /* Hero attack bounce */
    @keyframes heroAttack {
      0% { transform: translateX(0) scale(1); }
      40% { transform: translateX(60px) scale(1.1); }
      100% { transform: translateX(0) scale(1); }
    }

    .animate-attack {
      animation: heroAttack 0.5s ease-out;
    }

    /* Pulse glow for target listening */
    @keyframes soundWave {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 0.3; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    .sound-pulse::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 9999px;
      background-color: #ffbf00;
      z-index: -1;
      animation: soundWave 1.5s infinite;
    }

    /* Confetti particle animation */
    @keyframes confettiFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
    }

    .confetti {
      position: absolute;
      width: 12px;
      height: 12px;
      animation: confettiFall 3s linear forwards;
    }
  </style>
</head>

  <script>
    let currentLevelIndex = 0;
    let isSpeaking = false;
    let isProcessing = false;
    let monsterHP = 100;

    /* 7 Cantonese Minimal Pair Levels Data with custom SVG graphics (原第八關「釣/叫」已改為第七關) */
    const levelsData = [
      {
        level: 1,
        title: "[d] 豆 vs [g] 狗",
        optionA: { word: "豆", jyutping: "dau2", type: "d", svgKey: "pea" },
        optionB: { word: "狗", jyutping: "gau2", type: "g", svgKey: "dog" },
        target: "A"
      },
      {
        level: 2,
        title: "[d] 刀 vs [g] 高",
        optionA: { word: "刀", jyutping: "dou1", type: "d", svgKey: "knife" },
        optionB: { word: "高", jyutping: "gou1", type: "g", svgKey: "tall" },
        target: "A"
      },
      {
        level: 3,
        title: "[d] 多 vs [g] 哥",

    let cantoneseVoice = null;

    function initSpeechSynthesis() {
      if ('speechSynthesis' in window) {
        const updateVoices = () => {
          const voices = window.speechSynthesis.getVoices();
          cantoneseVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'zh_HK' || v.lang.includes('yue')) ||
                           voices.find(v => v.lang.startsWith('zh')) || null;
        };
        updateVoices();
        window.speechSynthesis.onvoiceschanged = updateVoices;
      }
    }

    function speakCantoneseText(text, onEndCallback, isTargetWord = false) {
      if (!('speechSynthesis' in window)) {
        if (onEndCallback) setTimeout(onEndCallback, 800);
        return;
      }

      window.speechSynthesis.cancel();

      let ttsText = text;
      let targetPitch = isTargetWord ? 1.1 : 1.25;

      if (text.includes('豆')) {
        ttsText = text.replace(/豆/g, '斗');
        targetPitch = isTargetWord ? 1.3 : 1.4;
      } else if (text.includes('架')) {
        ttsText = text.replace(/架/g, '假');
        targetPitch = isTargetWord ? 1.35 : 1.45;
      } else if (text.includes('驚')) {
        ttsText = text.replace(/驚/g, '經');
        targetPitch = isTargetWord ? 1.15 : 1.25;
      }

      const speechText = isTargetWord ? `${ttsText} ... ${ttsText}` : ttsText;
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = 'zh-HK';
      
      if (isTargetWord) {
        utterance.pitch = targetPitch; 
        utterance.rate = 0.5;
        utterance.volume = 1.0;
      } else {
        utterance.pitch = targetPitch; 
        utterance.rate = 0.85;
        utterance.volume = 1.0;
      }

      if (cantoneseVoice) {
        utterance.voice = cantoneseVoice;
      }

      isSpeaking = true;
      const listenBtn = document.getElementById('listen-target-btn');
      if (listenBtn) listenBtn.classList.add('animate-bounce');

      utterance.onend = () => {
        isSpeaking = false;
        if (listenBtn) listenBtn.classList.remove('animate-bounce');
        if (onEndCallback) onEndCallback();
      };

      utterance.onerror = () => {
        isSpeaking = false;
        if (listenBtn) listenBtn.classList.remove('animate-bounce');
        if (onEndCallback) onEndCallback();
      };

      window.speechSynthesis.speak(utterance);
    }

    function playWebAudioSFX(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'correct') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'wrong') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(160, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'hit') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.35, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'win') {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
            gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.12);
            osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
          });
        }
      } catch (e) {
        console.error("Audio error:", e);
      }
    }

    function playTargetAudio() {
      if (isSpeaking || isProcessing) return;
      const currentLevel = levelsData[currentLevelIndex];
      const targetWord = currentLevel[currentLevel.target === 'A' ? 'optionA' : 'optionB'].word;
      speakCantoneseText(targetWord, null, true);
    }

    function selectOption(choice) {
      if (isProcessing) return;

      const level = levelsData[currentLevelIndex];
      const isCorrect = choice === level.target;
      const chosenWord = choice === 'A' ? level.optionA.word : level.optionB.word;
      const targetWord = level.target === 'A' ? level.optionA.word : level.optionB.word;

      isProcessing = true;

      const chosenCard = document.getElementById(choice === 'A' ? 'option-a-btn' : 'option-b-btn');

      if (isCorrect) {
        playWebAudioSFX('correct');
        chosenCard.classList.add('border-green-500', 'bg-green-50');

        document.getElementById('hero-sprite').classList.add('animate-attack');
        setTimeout(() => document.getElementById('hero-sprite').classList.remove('animate-attack'), 500);

        setTimeout(() => {
          playWebAudioSFX('hit');
          const monster = document.getElementById('monster-sprite');
          monster.classList.add('animate-hit');
          setTimeout(() => monster.classList.remove('animate-hit'), 600);
        }, 200);

        monsterHP = Math.max(0, monsterHP - 14.3);
        document.getElementById('hp-bar').style.width = monsterHP + '%';
        document.getElementById('hp-text').innerText = Math.round(monsterHP) + '%';

        document.getElementById('feedback-message').innerText = `答啱啦！呢個字係「${chosenWord}」！`;
        document.getElementById('feedback-message').className = "text-xs sm:text-sm font-bold text-green-600";

        speakCantoneseText(`答啱啦！係${chosenWord}字！`, () => {
          if (currentLevelIndex < levelsData.length - 1) {
            currentLevelIndex++;
            setTimeout(() => {
              isProcessing = false;
              loadLevel(currentLevelIndex);
            }, 600);
          } else {
            isProcessing = false;
            triggerVictoryScreen();
          }
        });

      } else {
        playWebAudioSFX('wrong');
        chosenCard.classList.add('border-red-500', 'bg-red-50');

        document.getElementById('feedback-message').innerText = `唔係「${chosenWord}」喎，係「${targetWord}」啊，聽多次啊！`;
        document.getElementById('feedback-message').className = "text-xs sm:text-sm font-bold text-red-500";

        speakCantoneseText(`唔係「${chosenWord}」喎，係「${targetWord}」啊，聽多次啊`, () => {
          isProcessing = false;
          chosenCard.className = "scratch-card p-4 flex flex-col items-center justify-between cursor-pointer bg-white group active:scale-95 transition";
          playTargetAudio();
        });
      }
    }

    function triggerVictoryScreen() {
      playWebAudioSFX('win');

      document.getElementById('cage-graphic').style.opacity = '0';
      document.getElementById('cage-graphic').style.transform = 'scale(0)';

      const monster = document.getElementById('monster-sprite');
      monster.style.transform = 'translateY(50px) rotate(90deg) scale(0.9)';
      monster.style.opacity = '0.9';

      document.getElementById('monster-normal-eye').classList.add('hidden');
      document.getElementById('monster-fainted-eye').classList.remove('hidden');
      document.getElementById('dizzy-stars').classList.remove('hidden');
      document.getElementById('ko-badge').classList.remove('hidden');

      document.getElementById('princess-container').style.top = '55%';
      document.getElementById('princess-sprite').classList.add('animate-bounce');

      document.getElementById('feedback-message').innerText = "恭喜你！怪獸已被擊敗暈倒，拯救咗公主！順利通關！";
      document.getElementById('feedback-message').className = "text-base font-black text-purple-600";

      spawnConfetti();

      setTimeout(() => {
        speakCantoneseText("恭喜你！怪獸已經暈倒，你答啱晒所有字，順利救出公主啦！");
      }, 500);
    }

    function spawnConfetti() {
      const stage = document.getElementById('stage-area');
      const colors = ['#FFD700', '#FF4081', '#00E676', '#29B6F6', '#AB47BC'];
      
      for (let i = 0; i < 40; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 90 + '%';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 2 + 's';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        stage.appendChild(confetti);

        setTimeout(() => confetti.remove(), 5000);
      }
    }

    function startGame() {
      monsterHP = 100;
      document.getElementById('hp-bar').style.width = '100%';
      document.getElementById('hp-text').innerText = '100%';

      document.getElementById('cage-graphic').style.opacity = '1';
      document.getElementById('cage-graphic').style.transform = 'scale(1)';
      document.getElementById('princess-container').style.top = '1.5rem';
      document.getElementById('princess-sprite').classList.remove('animate-bounce');

      const monster = document.getElementById('monster-sprite');
      monster.style.transform = 'none';
      monster.style.opacity = '1';
      document.getElementById('monster-normal-eye').classList.remove('hidden');
      document.getElementById('monster-fainted-eye').classList.add('hidden');
      document.getElementById('dizzy-stars').classList.add('hidden');
      document.getElementById('ko-badge').classList.add('hidden');

      loadLevel(0);
    }

    function stopGame() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isProcessing = false;
      document.getElementById('feedback-message').innerText = "遊戲已停止。點擊綠旗重新開始。";
      document.getElementById('feedback-message').className = "text-xs sm:text-sm font-bold text-gray-500";
    }

    window.playTargetAudio = playTargetAudio;
    window.startGame = startGame;
    window.stopGame = stopGame;
    window.selectOption = selectOption;
    window.loadLevel = loadLevel;

    window.onload = function() {
      initSpeechSynthesis();

      const listenBtn = document.getElementById('listen-target-btn');
      if (listenBtn) listenBtn.addEventListener('click', playTargetAudio);

      const replayBtn = document.getElementById('replay-sound-btn');
      if (replayBtn) replayBtn.addEventListener('click', playTargetAudio);

      const greenFlagBtn = document.getElementById('green-flag-btn');
      if (greenFlagBtn) greenFlagBtn.addEventListener('click', startGame);

      const stopBtn = document.getElementById('stop-btn');
      if (stopBtn) stopBtn.addEventListener('click', stopGame);

      loadLevel(0);
    };
  </script>
</body>
</html>
